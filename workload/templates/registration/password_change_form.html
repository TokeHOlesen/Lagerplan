{% extends "base.html" %}
{% block title %}Skift adgangskode{% endblock %}

{% block content %}
<section class="card narrow">
  <h1>Skift adgangskode</h1>
  <form method="post" class="stacked-form">
    {% csrf_token %}
    {{ form.as_div }}
    <div class="form-actions">
      <button type="submit" class="button">Skift adgangskode</button>
      <a class="button secondary" href="{% url 'home' %}">Annullér</a>
    </div>
  </form>
</section>
{% endblock %}
